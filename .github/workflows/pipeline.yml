name: Verify, build and deploy proxy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proxy-tg-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate project
        run: make check
      - name: Install upstream build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends build-essential libssl-dev zlib1g-dev
      - name: Build pinned official MTProxy
        run: make build
      - name: Check binary and units
        run: |
          test -x dist/bin/mtproto-proxy
          ldd dist/bin/mtproto-proxy
          sudo install -d /opt/proxy_tg/current
          sudo cp proxy.py /opt/proxy_tg/current/proxy.py
          sudo systemd-analyze verify deploy/*.service deploy/*.timer
      - uses: actions/upload-artifact@v4
        with:
          name: proxy-tg-${{ github.sha }}
          path: dist/
          retention-days: 7

  deploy:
    needs: verify-build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AUTO_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: proxy-tg-${{ github.sha }}
          path: dist/
      - name: Upload and deploy with pinned OpenSSH host key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          VPS_FINGERPRINT: ${{ secrets.VPS_FINGERPRINT }}
        run: bash deploy/ci-deploy.sh
